name: NHL ranní report

on:
  schedule:
    - cron: "35 4 * * *"   # 5:35 našeho zimního času (UTC+1), e-mail se odešle v 6:00 přes Resend
  workflow_dispatch:
    inputs:
      weekly:
        description: "Přidat týdenní souhrn"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nhl_report.py
        env:
          FORCE: "1"
          SCHEDULED_SEND: ${{ github.event_name == 'schedule' && '1' || '' }}
          WEEKLY: ${{ inputs.weekly && '1' || '' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
