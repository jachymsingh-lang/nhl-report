name: NHL ranní report

on:
  schedule:
    - cron: "30 5 * * *"   # 6:30 našeho zimního času (UTC+1)
  workflow_dispatch:
    inputs:
      weekly:
        description: "Přidat týdenní souhrn"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nhl_report.py
        env:
          FORCE: "1"
          WEEKLY: ${{ inputs.weekly && '1' || '' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
